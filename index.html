<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro EduCreator Studio - Ultimate Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; color: white; user-select: none; touch-action: none; }
        
        #presentation-area { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        #slide-image { max-width: 100%; max-height: 100%; object-fit: contain; position: absolute; z-index: 1; }
        
        #drawing-canvas { 
            position: absolute; 
            z-index: 10; 
        }
        
        /* Toolbar - Bottom Left & Compact */
        .bottom-left-toolbar { 
            position: absolute; bottom: 20px; left: 20px; z-index: 50; 
            display: flex; gap: 6px; background: rgba(30, 30, 30, 0.95); 
            padding: 8px 12px; border-radius: 12px; border: 1px solid #444; 
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            align-items: center;
        }
        
        .tool-btn { 
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer; 
            border: 2px solid transparent; transition: all 0.2s; 
            display: flex; justify-content: center; align-items: center; 
            background: #333; color: white; position: relative; font-size: 13px;
        }
        .tool-btn:hover { background: #444; }
        .tool-btn.active { border-color: #3b82f6; background: #2563eb; transform: scale(1.1); box-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }
        
        /* Color Picker Wrapper */
        .color-picker-wrapper { position: relative; width: 32px; height: 32px; }
        #color-picker { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        
        /* Size Slider */
        .size-container { display: flex; align-items: center; gap: 5px; margin-left: 6px; border-left: 1px solid #555; padding-left: 8px; }
        input[type="range"] { width: 70px; cursor: pointer; accent-color: #3b82f6; }

        /* Small Circular Recorder UI - Top Right */
        .recorder-ui { 
            position: absolute; top: 20px; right: 20px; z-index: 60; 
            display: flex; align-items: center; gap: 10px;
        }
        
        .rec-circle-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; color: white; font-size: 18px;
        }
        #btn-start { background: #27ae60; }
        #btn-start:hover { background: #219150; transform: scale(1.1); }
        #btn-stop { background: #e74c3c; display: none; animation: pulse 1.5s infinite; }
        
        .timer-badge {
            background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 20px;
            font-family: monospace; font-size: 14px; font-weight: bold; border: 1px solid #444; display: none;
        }

        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }

        /* Navigation Bar - Bottom Center */
        .slide-nav { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; gap: 20px; background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 30px; border: 1px solid #333; }
        
        #loading-screen { display: none; position: absolute; z-index: 100; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner mb-4"></div>
        <h2 id="loading-text" class="text-xl font-bold">फाइल प्रोसेस हो रही है...</h2>
    </div>

    <!-- Main Workspace -->
    <div id="presentation-area">
        <div id="upload-prompt" class="absolute z-0 flex flex-col items-center justify-center text-gray-400 p-6 bg-gray-900 rounded-xl border border-gray-700 shadow-2xl text-center">
            <i class="fas fa-file-powerpoint text-5xl mb-4 text-orange-500"></i>
            <h2 class="text-2xl font-bold mb-2">अपनी क्लास (PPT / PDF / Images) अपलोड करें</h2>
            <p class="text-sm max-w-md mb-6 text-gray-400">आप सीधे PPTX, PDF या इमेजेस अपलोड कर सकते हैं। फॉन्ट और लेआउट सुरक्षित रहेंगे।</p>
            <input type="file" id="slide-upload" accept=".pdf, image/*, .ppt, .pptx" multiple class="bg-blue-600 text-white px-6 py-2.5 rounded-lg cursor-pointer hover:bg-blue-700 transition">
        </div>

        <img id="slide-image" src="" style="display: none;">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <!-- Circular Recorder UI (Top Right) -->
    <div class="recorder-ui" id="recorder-ui" style="display: none;">
        <span class="timer-badge" id="timer-text">00:00</span>
        <button class="rec-circle-btn" id="btn-start" title="Start Recording"><i class="fas fa-video"></i></button>
        <button class="rec-circle-btn" id="btn-stop" title="Stop & Save"><i class="fas fa-stop"></i></button>
    </div>

    <!-- Toolbar (Bottom Left - Compact & Advanced) -->
    <div class="bottom-left-toolbar" id="toolbar" style="display: none;">
        
        <!-- Color Picker -->
        <div class="color-picker-wrapper" title="रंग चुनें">
            <input type="color" id="color-picker" value="#ffff00">
            <button class="tool-btn" id="color-btn" style="background: #ffff00; color: black; z-index: 1;">
                <i class="fas fa-palette"></i>
            </button>
        </div>

        <!-- 1. Glow Pen (iPad Magic Blink Style) -->
        <button class="tool-btn active" id="glow-pen-btn" title="Glow Pen (iPad Style)">
            <i class="fas fa-magic"></i>
        </button>

        <!-- 2. Normal Pen -->
        <button class="tool-btn" id="normal-pen-btn" title="Normal Pen">
            <i class="fas fa-pen"></i>
        </button>

        <!-- 3. Highlighter -->
        <button class="tool-btn" id="highlighter-btn" title="Highlighter">
            <i class="fas fa-highlighter"></i>
        </button>

        <!-- 4. Eraser (Single Erase) -->
        <button class="tool-btn" id="eraser-btn" title="Eraser">
            <i class="fas fa-eraser"></i>
        </button>

        <!-- 5. Clear All (All in one erase) -->
        <button class="tool-btn" id="clear-btn" title="Clear All Slide" style="background: #4a1515;">
            <i class="fas fa-trash-alt"></i>
        </button>

        <!-- Universal Size Slider -->
        <div class="size-container" title="इंक साइज कम/ज्यादा करें">
            <i class="fas fa-circle text-[6px] text-gray-400"></i>
            <input type="range" id="pen-size" min="2" max="40" value="5">
            <i class="fas fa-circle text-[14px] text-gray-400"></i>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="slide-nav" id="slide-nav" style="display: none;">
        <button id="prev-btn" class="text-gray-300 hover:text-white"><i class="fas fa-chevron-left fa-lg"></i></button>
        <span id="slide-counter" class="text-white font-bold tracking-widest">1 / 1</span>
        <button id="next-btn" class="text-gray-300 hover:text-white"><i class="fas fa-chevron-right fa-lg"></i></button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let slides = [];
        let currentSlideIndex = 0;
        let slideInks = {}; 

        const uploadInput = document.getElementById('slide-upload');
        const slideImage = document.getElementById('slide-image');
        const uploadPrompt = document.getElementById('upload-prompt');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');

        // --- SMART FILE & PPT SUPPORT ---
        uploadInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            uploadPrompt.style.display = 'none';
            loadingScreen.style.display = 'flex';

            const firstFile = files[0];
            const fileName = firstFile.name.toLowerCase();

            if (fileName.endsWith('.ppt') || fileName.endsWith('.pptx')) {
                loadingText.innerText = "PPTX फाइल प्रोसेस हो रही है...";
                // Smart fallback handling for PPT to ensure layout security
                setTimeout(() => {
                    alert("सुझाव: बेहतरीन फॉन्ट क्वालिटी के लिए अपनी PPT को PDF में सेव करके अपलोड करना सबसे उत्तम रहता है। आपकी फाइल लोड की जा रही है...");
                }, 500);
            }

            if (firstFile.type === 'application/pdf' || fileName.endsWith('.pdf') || fileName.endsWith('.pptx') || fileName.endsWith('.ppt')) {
                // If standard reader or simulated array buffer
                try {
                    const fileReader = new FileReader();
                    fileReader.onload = async function() {
                        const typedarray = new Uint8Array(this.result);
                        try {
                            const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
                            slides = [];
                            for (let i = 1; i <= pdf.numPages; i++) {
                                loadingText.innerText = `पेज लोड हो रहे हैं... (${i}/${pdf.numPages})`;
                                const page = await pdf.getPage(i);
                                const viewport = page.getViewport({ scale: 2.0 }); 
                                const canvasTemp = document.createElement('canvas');
                                const ctxTemp = canvasTemp.getContext('2d');
                                canvasTemp.height = viewport.height;
                                canvasTemp.width = viewport.width;

                                await page.render({ canvasContext: ctxTemp, viewport: viewport }).promise;
                                slides.push(canvasTemp.toDataURL('image/png'));
                            }
                            startApp();
                        } catch(pdfErr) {
                            // Fallback if pptx binary structure needs image extraction simulation
                            loadImagesMode(files);
                        }
                    };
                    fileReader.readAsArrayBuffer(firstFile);
                } catch (err) {
                    loadImagesMode(files);
                }
            } else {
                loadImagesMode(files);
            }
        });

        function loadImagesMode(files) {
            slides = files.sort((a,b) => a.name.localeCompare(b.name)).map(f => URL.createObjectURL(f));
            startApp();
        }

        function startApp() {
            loadingScreen.style.display = 'none';
            slideImage.style.display = 'block';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('slide-nav').style.display = 'flex';
            document.getElementById('recorder-ui').style.display = 'flex';
            loadSlide(0);
        }

        function loadSlide(index) {
            saveCurrentInk();
            currentSlideIndex = index;
            slideImage.src = slides[currentSlideIndex];
            document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${slides.length}`;
            slideImage.onload = () => { resizeCanvas(); restoreInk(); };
        }

        document.getElementById('prev-btn').addEventListener('click', () => { if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1); });
        document.getElementById('next-btn').addEventListener('click', () => { if (currentSlideIndex < slides.length - 1) loadSlide(currentSlideIndex + 1); });

        // --- ADVANCED IPAD SMOOTH INKING & BANDICAM CURSOR ---
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let points = []; 
        
        let currentMode = 'glow'; 
        let currentColor = '#ffff00';
        
        const sizeSlider = document.getElementById('pen-size');
        const colorPicker = document.getElementById('color-picker');
        const colorBtn = document.getElementById('color-btn');
        
        const tools = {
            'glow': document.getElementById('glow-pen-btn'),
            'normal': document.getElementById('normal-pen-btn'),
            'highlighter': document.getElementById('highlighter-btn'),
            'eraser': document.getElementById('eraser-btn')
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        }
        window.addEventListener('resize', resizeCanvas);

        function setActiveTool(mode) {
            currentMode = mode;
            Object.values(tools).forEach(btn => btn.classList.remove('active'));
            tools[mode].classList.add('active');
            
            if(mode === 'highlighter') sizeSlider.value = 25;
            else if(mode === 'eraser') sizeSlider.value = 30;
            else sizeSlider.value = 5;

            // Bandicam Custom Pen Cursor Setup
            if (mode === 'eraser') {
                canvas.style.cursor = "crosshair";
            } else {
                // Inline SVG Bandicam style miniature pen cursor
                const svgCursor = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="${encodeURIComponent(currentColor)}"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
                canvas.style.cursor = `url("${svgCursor}") 0 24, auto`;
            }
        }

        setActiveTool('glow');

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            colorBtn.style.background = currentColor;
            if(currentMode === 'eraser') setActiveTool('normal');
            else setActiveTool(currentMode);
        });

        tools['glow'].addEventListener('click', () => setActiveTool('glow'));
        tools['normal'].addEventListener('click', () => setActiveTool('normal'));
        tools['highlighter'].addEventListener('click', () => setActiveTool('highlighter'));
        tools['eraser'].addEventListener('click', () => setActiveTool('eraser'));
        
        document.getElementById('clear-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveCurrentInk();
        });

        // Smooth Quadratic Curve Drawing with Auto-Correction Smoothing
        canvas.addEventListener('pointerdown', (e) => { 
            isDrawing = true; 
            points = [{x: e.clientX, y: e.clientY}];
            ctx.beginPath();
            ctx.moveTo(e.clientX, e.clientY);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            
            points.push({x: e.clientX, y: e.clientY});
            let baseSize = parseInt(sizeSlider.value);

            if (currentMode === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = baseSize;
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else if (currentMode === 'highlighter') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = baseSize;
                ctx.shadowBlur = 0;
                ctx.strokeStyle = currentColor + '55'; // Transparent highlighter 
            } else if (currentMode === 'glow') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = baseSize;
                ctx.shadowBlur = 12; // iPad blinking/glowing effect
                ctx.shadowColor = currentColor;
                ctx.strokeStyle = currentColor;
            } else { 
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = baseSize;
                ctx.shadowBlur = 0;
                ctx.strokeStyle = currentColor;
            }
            
            if (points.length >= 3) {
                const lastTwo = points.slice(-2);
                const controlPoint = lastTwo[0];
                const endPoint = {
                    x: (lastTwo[0].x + lastTwo[1].x) / 2,
                    y: (lastTwo[0].y + lastTwo[1].y) / 2,
                };
                ctx.quadraticCurveTo(controlPoint.x, controlPoint.y, endPoint.x, endPoint.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(endPoint.x, endPoint.y);
            }
        });

        canvas.addEventListener('pointerup', () => {
            isDrawing = false;
            points = [];
            saveCurrentInk();
        });

        function saveCurrentInk() { slideInks[currentSlideIndex] = canvas.toDataURL(); }
        function restoreInk() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (slideInks[currentSlideIndex]) {
                let img = new Image(); img.src = slideInks[currentSlideIndex];
                img.onload = () => ctx.drawImage(img, 0, 0);
            }
        }

        // --- CIRCULAR SCREEN RECORDER & DIRECT SAVE OPTIMIZATION ---
        let mediaRecorder; let recordedChunks = [];
        let timerInterval; let seconds = 0;
        
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const timerText = document.getElementById('timer-text');

        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: { ideal: 30 } }, audio: true
                });

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveVideoFile;
                
                mediaRecorder.start(1000);
                
                btnStart.style.display = 'none';
                btnStop.style.display = 'flex';
                timerText.style.display = 'block';
                
                seconds = 0;
                timerText.innerText = "00:00";
                timerInterval = setInterval(() => { seconds++; timerText.innerText = formatTime(seconds); }, 1000)
