<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro EduCreator Studio - iPad Notes Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; color: white; user-select: none; touch-action: none; cursor: default; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        #presentation-area { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #0b0b0b; }
        #slide-image { max-width: 100%; max-height: 100%; object-fit: contain; position: absolute; z-index: 1; border-radius: 8px; }
        
        #drawing-canvas { 
            position: absolute; 
            z-index: 10; 
            cursor: default; 
        }
        
        /* iPad Notes Floating Markup Toolbar */
        .bottom-left-toolbar { 
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 50; 
            display: none; gap: 6px; background: rgba(28, 28, 30, 0.85); 
            padding: 8px 14px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(20px);
            align-items: center; transition: all 0.3s ease;
        }
        
        .tool-btn { 
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer; 
            border: 2px solid transparent; transition: all 0.2s; 
            display: flex; justify-content: center; align-items: center; 
            background: rgba(255, 255, 255, 0.08); color: white; position: relative; font-size: 13px;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
        .tool-btn.active { border-color: #0a84ff; background: #0a84ff; box-shadow: 0 0 12px rgba(10, 132, 255, 0.5); }
        
        .color-picker-wrapper { position: relative; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); }
        #color-picker { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        
        .size-container { display: flex; align-items: center; gap: 6px; margin-left: 5px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 8px; }
        input[type="range"] { width: 70px; cursor: pointer; accent-color: #0a84ff; height: 4px; border-radius: 2px; background: #555; }

        /* Recorder UI */
        .recorder-ui { 
            position: absolute; top: 20px; right: 20px; z-index: 60; 
            display: none; align-items: center; gap: 10px;
        }
        
        .rec-circle-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.3s; color: white; font-size: 16px;
        }
        #btn-start { background: #30d158; }
        #btn-start:hover { background: #28b84d; transform: scale(1.05); }
        #btn-stop { background: #ff453a; display: none; animation: pulse 1.5s infinite; }
        
        .timer-badge {
            background: rgba(28, 28, 30, 0.85); padding: 4px 10px; border-radius: 20px;
            font-family: monospace; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); display: none; backdrop-filter: blur(10px);
        }

        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255, 69, 58, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); } }

        /* Slide Navigation */
        .slide-nav { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 50; display: none; gap: 15px; background: rgba(28, 28, 30, 0.85); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); align-items: center; }
        
        body.fullscreen-mode .slide-nav { opacity: 0.7; transform: translateX(-50%) scale(0.9); }
        body.fullscreen-mode .slide-nav:hover { opacity: 1; }

        #loading-screen { display: none; position: absolute; z-index: 100; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #0a84ff; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner mb-4"></div>
        <h2 id="loading-text" class="text-lg font-medium">क्लास फाइल लोड हो रही है...</h2>
    </div>

    <!-- Main Workspace -->
    <div id="presentation-area">
        <div id="upload-prompt" class="absolute z-0 flex flex-col items-center justify-center text-gray-400 p-8 bg-[#1c1c1e] rounded-2xl border border-white/10 shadow-2xl text-center max-w-md">
            <i class="fas fa-file-pdf text-5xl mb-4 text-[#ff453a]"></i>
            <h2 class="text-xl font-bold mb-2 text-white">अपनी क्लास नोट्स अपलोड करें</h2>
            <p class="text-xs mb-6 text-gray-400">PDF या एकाधिक Images चुनें और पढ़ाना शुरू करें।</p>
            <input type="file" id="slide-upload" accept=".pdf, image/*" multiple class="bg-[#0a84ff] text-white text-xs px-5 py-2.5 rounded-xl cursor-pointer hover:bg-blue-600 transition font-medium">
        </div>

        <img id="slide-image" src="" style="display: none;">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <div class="recorder-ui" id="recorder-ui">
        <span class="timer-badge" id="timer-text">00:00</span>
        <button class="rec-circle-btn" id="btn-start" title="Start Recording"><i class="fas fa-video"></i></button>
        <button class="rec-circle-btn" id="btn-stop" title="Stop & Save"><i class="fas fa-stop"></i></button>
    </div>

    <!-- iPad Floating Markup Toolbar -->
    <div class="bottom-left-toolbar" id="toolbar">
        <div class="color-picker-wrapper" title="रंग बदलें">
            <input type="color" id="color-picker" value="#ffff00">
            <button class="tool-btn" id="color-btn" style="background: #ffff00; color: black; z-index: 1; border: none;">
                <i class="fas fa-palette text-xs"></i>
            </button>
        </div>
        <button class="tool-btn active" id="glow-pen-btn" title="Glow Pen"><i class="fas fa-magic"></i></button>
        <button class="tool-btn" id="normal-pen-btn" title="Normal Pen"><i class="fas fa-pen"></i></button>
        <button class="tool-btn" id="highlighter-btn" title="Highlighter"><i class="fas fa-highlighter"></i></button>
        <button class="tool-btn" id="eraser-btn" title="Eraser"><i class="fas fa-eraser"></i></button>
        <button class="tool-btn" id="clear-btn" title="Clear Slide" style="background: rgba(255,69,58,0.2); color: #ff453a;"><i class="fas fa-trash-alt"></i></button>
        <div class="size-container">
            <input type="range" id="pen-size" min="2" max="40" value="5">
        </div>
        <button class="tool-btn" id="fullscreen-btn" title="Full Screen"><i class="fas fa-expand"></i></button>
    </div>

    <!-- Slide Navigation Capsule -->
    <div class="slide-nav" id="slide-nav">
        <button id="prev-btn" class="text-gray-300 hover:text-white text-xs"><i class="fas fa-chevron-left"></i></button>
        <span id="slide-counter" class="text-white text-xs font-bold tracking-wider">1 / 1</span>
        <button id="next-btn" class="text-gray-300 hover:text-white text-xs"><i class="fas fa-chevron-right"></i></button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let slides = []; let currentSlideIndex = 0; let slideInks = {}; 
        const uploadInput = document.getElementById('slide-upload');
        const slideImage = document.getElementById('slide-image');
        const uploadPrompt = document.getElementById('upload-prompt');
        const loadingScreen = document.getElementById('loading-screen');

        uploadInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            uploadPrompt.style.display = 'none';
            loadingScreen.style.display = 'flex';
            if (files[0].type === 'application/pdf' || files[0].name.toLowerCase().endsWith('.pdf')) {
                try {
                    const fileReader = new FileReader();
                    fileReader.onload = async function() {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
                        slides = [];
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({ scale: 2.0 }); 
                            const canvasTemp = document.createElement('canvas');
                            canvasTemp.height = viewport.height; canvasTemp.width = viewport.width;
                            await page.render({ canvasContext: canvasTemp.getContext('2d'), viewport: viewport }).promise;
                            slides.push(canvasTemp.toDataURL('image/png'));
                        }
                        startApp();
                    };
                    fileReader.readAsArrayBuffer(files[0]);
                } catch (err) { alert("PDF Error"); loadingScreen.style.display = 'none'; uploadPrompt.style.display = 'flex'; }
            } else {
                slides = files.sort((a,b) => a.name.localeCompare(b.name)).map(f => URL.createObjectURL(f));
                startApp();
            }
        });

        function startApp() {
            loadingScreen.style.display = 'none'; slideImage.style.display = 'block';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('slide-nav').style.display = 'flex';
            document.getElementById('recorder-ui').style.display = 'flex';
            loadSlide(0);
        }

        function loadSlide(index) { saveCurrentInk(); currentSlideIndex = index; slideImage.src = slides[currentSlideIndex]; document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${slides.length}`; slideImage.onload = () => { resizeCanvas(); restoreInk(); }; }
        document.getElementById('prev-btn').addEventListener('click', () => { if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1); });
        document.getElementById('next-btn').addEventListener('click', () => { if (currentSlideIndex < slides.length - 1) loadSlide(currentSlideIndex + 1); });

        // Full Screen Toggle Feature
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                document.body.classList.add('fullscreen-mode');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                document.body.classList.remove('fullscreen-mode');
            }
        });

        const canvas = document.getElementById('drawing-canvas'); const ctx = canvas.getContext('2d');
        let isDrawing = false; let points = []; let currentMode = 'glow'; let currentColor = '#ffff00';
        const sizeSlider = document.getElementById('pen-size'); const colorPicker = document.getElementById('color-picker'); const colorBtn = document.getElementById('color-btn');
        const tools = { 'glow': document.getElementById('glow-pen-btn'), 'normal': document.getElementById('normal-pen-btn'), 'highlighter': document.getElementById('highlighter-btn'), 'eraser': document.getElementById('eraser-btn') };

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
        window.addEventListener('resize', resizeCanvas);
        function setActiveTool(mode) {
            currentMode = mode; Object.values(tools).forEach(btn => btn.classList.remove('active')); tools[mode].classList.add('active');
            if(mode === 'highlighter') sizeSlider.value = 25; else if(mode === 'eraser') sizeSlider.value = 35; else sizeSlider.value = 5;
        }

        setActiveTool('glow');
        colorPicker.addEventListener('input', (e) => { currentColor = e.target.value; colorBtn.style.background = currentColor; });
        tools['glow'].addEventListener('click', () => setActiveTool('glow')); tools['normal'].addEventListener('click', () => setActiveTool('normal')); tools['highlighter'].addEventListener('click', () => setActiveTool('highlighter')); tools['eraser'].addEventListener('click', () => setActiveTool('eraser'));
        document.getElementById('clear-btn').addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));

        canvas.addEventListener('pointerdown', (e) => { isDrawing = true; points = [{x: e.clientX, y: e.clientY}]; ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); });
        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            points.push({x: e.clientX, y: e.clientY});
            let baseSize = parseInt(sizeSlider.value);
            if (currentMode === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = baseSize; ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
            else if (currentMode === 'highlighter') { ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = baseSize; ctx.shadowBlur = 0; ctx.strokeStyle = currentColor + '66'; }
            else if (currentMode === 'glow') { ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = baseSize; ctx.shadowBlur = 15; ctx.shadowColor = currentColor; ctx.strokeStyle = currentColor; }
            else { ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = baseSize; ctx.shadowBlur = 0; ctx.strokeStyle = currentColor; }
            if (points.length >= 3) {
                const controlPoint = points[points.length - 2];
                const endPoint = { x: (points[points.length - 2].x + points[points.length - 1].x) / 2, y: (points[points.length - 2].y + points[points.length - 1].y) / 2, };
                ctx.quadraticCurveTo(controlPoint.x, controlPoint.y, endPoint.x, endPoint.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(endPoint.x, endPoint.y);
            }
        });
        canvas.addEventListener('pointerup', () => { isDrawing = false; points = []; });
        function saveCurrentInk() { slideInks[currentSlideIndex] = canvas.toDataURL(); }
        function restoreInk() { ctx.clearRect(0, 0, canvas.width, canvas.height); if (slideInks[currentSlideIndex]) { let img = new Image(); img.src = slideInks[currentSlideIndex]; img.onload = () => ctx.drawImage(img, 0, 0); } }

        let mediaRecorder; let recordedChunks = []; let timerInterval; let seconds = 0;
        const btnStart = document.getElementById('btn-start'); const btnStop = document.getElementById('btn-stop'); const timerText = document.getElementById('timer-text');
        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveVideo;
                mediaRecorder.start(250); btnStart.style.display = 'none'; btnStop.style.display = 'flex'; timerText.style.display = 'block';
                timerInterval = setInterval(() => { seconds++; timerText.innerText = new Date(seconds * 1000).toISOString().substr(14, 5); }, 1000);
            } catch (err) { alert("Permission Denied."); }
        });
        btnStop.addEventListener('click', () => { mediaRecorder.stop(); btnStart.style.display = 'flex'; btnStop.style.display = 'none'; timerText.style.display = 'none'; clearInterval(timerInterval); });
        async function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `Recording_${new Date().getTime()}.webm`; a.click();
        }
    </script>
</body>
</html>
