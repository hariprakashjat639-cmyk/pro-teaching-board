<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro EduCreator Studio - Perfect Pen Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; color: white; user-select: none; touch-action: none; }
        #presentation-area { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        #slide-image { max-width: 100%; max-height: 100%; object-fit: contain; position: absolute; z-index: 1; }
        #drawing-canvas { position: absolute; z-index: 10; cursor: none; }

        /* Tilted Pencil Cursor - Tip at Top Right */
        #custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            display: none;
            /* Adjusting translation to align tip at top-right with mouse */
            transform: translate(-28px, 2px); 
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.5));
        }
        
        .bottom-left-toolbar { position: absolute; bottom: 20px; left: 20px; z-index: 50; display: flex; gap: 8px; background: rgba(30, 30, 30, 0.95); padding: 10px 15px; border-radius: 12px; border: 1px solid #444; box-shadow: 5px 5px 20px rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; }
        .tool-btn { width: 32px; height: 32px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; display: flex; justify-content: center; align-items: center; background: #333; color: white; position: relative; font-size: 14px; }
        .tool-btn:hover { background: #444; }
        .tool-btn.active { border-color: #3b82f6; background: #2563eb; transform: scale(1.1); box-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }
        .color-picker-wrapper { position: relative; width: 32px; height: 32px; }
        #color-picker { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        .size-container { display: flex; align-items: center; gap: 5px; margin-left: 10px; border-left: 1px solid #555; padding-left: 10px; }
        input[type="range"] { width: 80px; cursor: pointer; accent-color: #3b82f6; }
        .recorder-ui { position: absolute; top: 20px; right: 20px; z-index: 60; display: flex; align-items: center; gap: 10px; }
        .rec-circle-btn { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; color: white; font-size: 18px; }
        #btn-start { background: #27ae60; }
        #btn-stop { background: #e74c3c; display: none; }
        .slide-nav { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; gap: 20px; background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 30px; border: 1px solid #333; }
    </style>
</head>
<body>

    <!-- New Tilted Pencil Cursor SVG -->
    <div id="custom-cursor">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- The Tilted Body -->
            <path d="M18 3L21 6L9 18L6 15L18 3Z" fill="#ffffff"/>
            <!-- The Tip -->
            <path d="M18 3L21 6L19 7L16 4L18 3Z" fill="#ffcc99"/>
            <!-- Eraser End -->
            <path d="M9 18L6 15L3 18L6 21L9 18Z" fill="#ff4d4d"/>
        </svg>
    </div>

    <!-- Main Workspace -->
    <div id="presentation-area">
        <div id="upload-prompt" class="absolute z-0 flex flex-col items-center justify-center text-gray-400 p-6 bg-gray-900 rounded-xl border border-gray-700 text-center">
            <i class="fas fa-file-pdf text-5xl mb-4 text-red-500"></i>
            <h2 class="text-2xl font-bold mb-2">अपनी क्लास अपलोड करें</h2>
            <input type="file" id="slide-upload" accept=".pdf, image/*" multiple class="bg-blue-600 text-white px-6 py-2.5 rounded-lg cursor-pointer">
        </div>
        <img id="slide-image" src="" style="display: none;">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <!-- Toolbar -->
    <div class="bottom-left-toolbar" id="toolbar" style="display: none;">
        <div class="color-picker-wrapper"><input type="color" id="color-picker" value="#ffff00"><button class="tool-btn" id="color-btn" style="background: #ffff00;"><i class="fas fa-palette"></i></button></div>
        <button class="tool-btn active" id="glow-pen-btn"><i class="fas fa-magic"></i></button>
        <button class="tool-btn" id="normal-pen-btn"><i class="fas fa-pen"></i></button>
        <button class="tool-btn" id="highlighter-btn"><i class="fas fa-highlighter"></i></button>
        <button class="tool-btn" id="eraser-btn"><i class="fas fa-eraser"></i></button>
        <button class="tool-btn" id="clear-btn" style="background: #4a1515;"><i class="fas fa-trash-alt"></i></button>
        <div class="size-container"><input type="range" id="pen-size" min="2" max="40" value="5"></div>
    </div>

    <div class="slide-nav" id="slide-nav" style="display: none;">
        <button id="prev-btn" class="text-gray-300"><i class="fas fa-chevron-left"></i></button>
        <span id="slide-counter" class="text-white font-bold">1 / 1</span>
        <button id="next-btn" class="text-gray-300"><i class="fas fa-chevron-right"></i></button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let slides = []; let currentSlideIndex = 0; let slideInks = {};
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const customCursor = document.getElementById('custom-cursor');
        let currentMode = 'glow';

        // Initialization
        document.getElementById('slide-upload').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            document.getElementById('upload-prompt').style.display = 'none';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('slide-nav').style.display = 'flex';
            
            // Simplified loading for this demo
            slides = files.map(f => URL.createObjectURL(f));
            loadSlide(0);
        });

        function loadSlide(index) {
            currentSlideIndex = index;
            const img = document.getElementById('slide-image');
            img.src = slides[currentSlideIndex];
            img.style.display = 'block';
            document.getElementById('slide-counter').innerText = `${index + 1} / ${slides.length}`;
            resizeCanvas();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // Pencil Cursor Movement Logic
        window.addEventListener('mousemove', (e) => {
            if (currentMode !== 'eraser') {
                customCursor.style.left = e.clientX + 'px';
                customCursor.style.top = e.clientY + 'px';
                customCursor.style.display = 'block';
            } else {
                customCursor.style.display = 'none';
            }
        });

        // Drawing Logic
        let isDrawing = false;
        canvas.addEventListener('pointerdown', () => isDrawing = true);
        canvas.addEventListener('pointerup', () => { isDrawing = false; ctx.beginPath(); });
        canvas.addEventListener('pointermove', (e) => {
            if(!isDrawing) return;
            ctx.lineWidth = document.getElementById('pen-size').value;
            ctx.strokeStyle = document.getElementById('color-picker').value;
            if(currentMode === 'eraser') ctx.globalCompositeOperation = 'destination-out';
            else ctx.globalCompositeOperation = 'source-over';
            
            ctx.lineCap = 'round';
            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();
        });

        // Tool Selection
        document.getElementById('glow-pen-btn').onclick = () => currentMode = 'glow';
        document.getElementById('eraser-btn').onclick = () => { currentMode = 'eraser'; customCursor.style.display = 'none'; };
        document.getElementById('normal-pen-btn').onclick = () => currentMode = 'normal';
        document.getElementById('prev-btn').onclick = () => loadSlide(Math.max(0, currentSlideIndex - 1));
        document.getElementById('next-btn').onclick = () => loadSlide(Math.min(slides.length - 1, currentSlideIndex + 1));
    </script>
</body>
</html>
