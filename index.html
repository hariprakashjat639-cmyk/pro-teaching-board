<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro EduCreator Studio - Offline</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js Library for reading PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; color: white; user-select: none; }
        
        #presentation-area { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        #slide-image { max-width: 100%; max-height: 100%; object-fit: contain; position: absolute; z-index: 1; }
        #drawing-canvas { position: absolute; z-index: 10; cursor: crosshair; }
        
        /* Smaller iPad Style Ink Buttons */
        .ink-toolbar { position: absolute; bottom: 20px; left: 20px; z-index: 50; display: flex; align-items: center; gap: 8px; background: rgba(30, 30, 30, 0.9); padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .ink-btn { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; position: relative; }
        .ink-btn.active { transform: translateY(-5px) scale(1.1); border-color: white; box-shadow: 0 5px 15px rgba(255,255,255,0.3); }
        
        .glow-pen { background: radial-gradient(circle, #ff007f, #8a2be2); animation: pulseGlow 1.5s infinite alternate; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px #ff007f; } 100% { box-shadow: 0 0 15px #8a2be2, 0 0 20px #ff007f; } }
        
        /* Size Slider */
        .size-slider { width: 80px; margin-left: 10px; cursor: pointer; }

        /* Floating Circular Recorder */
        .record-circle { position: absolute; top: 20px; right: 20px; z-index: 60; width: 55px; height: 55px; border-radius: 50%; background: #2c2c2c; border: 3px solid #555; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .record-circle:hover { border-color: #e74c3c; }
        .record-circle.recording { border-color: #e74c3c; animation: borderBlink 1s infinite; }
        @keyframes borderBlink { 0% { box-shadow: 0 0 5px #e74c3c; } 50% { box-shadow: 0 0 20px #e74c3c; } 100% { box-shadow: 0 0 5px #e74c3c; } }
        
        #timer-text { font-size: 12px; font-weight: bold; margin-top: 2px; display: none; }
        
        /* Hidden Recorder Menu */
        .recorder-menu { position: absolute; top: 85px; right: 20px; z-index: 59; background: #2c2c2c; width: 220px; border-radius: 10px; border: 1px solid #444; padding: 15px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .record-btn { background: #e74c3c; transition: 0.3s; }
        .record-btn:hover { background: #c0392b; }

        .slide-nav { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; gap: 15px; background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 30px; }
        
        /* Loading Screen for PDF */
        #loading-screen { display: none; position: absolute; z-index: 100; width: 100%; height: 100%; background: rgba(0,0,0,0.8); flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner mb-4"></div>
        <h2 id="loading-text" class="text-xl font-bold">PDF लोड हो रही है... कृपया प्रतीक्षा करें</h2>
    </div>

    <div id="presentation-area">
        <div id="upload-prompt" class="absolute z-0 flex flex-col items-center justify-center text-gray-400">
            <i class="fas fa-file-pdf text-6xl mb-4 text-red-500"></i>
            <h2 class="text-2xl font-bold mb-2">PDF या इमेजेस अपलोड करें</h2>
            <p>अपनी PPT को PDF में सेव करें और यहाँ डालें</p>
            <input type="file" id="slide-upload" accept="application/pdf, image/*" multiple class="mt-4 bg-blue-600 text-white px-4 py-2 rounded cursor-pointer">
        </div>

        <img id="slide-image" src="" style="display: none;">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <!-- Toolbar -->
    <div class="ink-toolbar" id="toolbar" style="display: none;">
        <button class="ink-btn glow-pen active" data-color="glow" title="Glowing Pen"></button>
        <button class="ink-btn bg-white" data-color="#ffffff" title="White Pen"></button>
        <button class="ink-btn bg-yellow-400" data-color="#facc15" title="Yellow Pen"></button>
        <button class="ink-btn bg-blue-500" data-color="#3b82f6" title="Blue Pen"></button>
        <button class="ink-btn bg-green-400 opacity-80 border-dashed border-2" data-color="rgba(74, 222, 128, 0.4)" title="Highlighter"></button>
        <button class="ink-btn bg-gray-600 flex items-center justify-center text-white" data-color="erase" title="Eraser"><i class="fas fa-eraser text-[10px]"></i></button>
        
        <!-- Pen Size Control -->
        <div class="border-l border-gray-600 pl-2 ml-1 flex items-center">
            <i class="fas fa-circle text-white text-[8px]"></i>
            <input type="range" id="pen-size" class="size-slider" min="1" max="20" value="4">
            <i class="fas fa-circle text-white text-sm ml-1"></i>
        </div>

        <button id="clear-slide" class="ml-2 text-gray-300 hover:text-red-500" title="Clear Slide"><i class="fas fa-trash text-sm"></i></button>
    </div>

    <div class="slide-nav" id="slide-nav" style="display: none;">
        <button id="prev-btn" class="text-white hover:text-blue-400"><i class="fas fa-chevron-left"></i></button>
        <span id="slide-counter" class="text-white font-bold">1 / 1</span>
        <button id="next-btn" class="text-white hover:text-blue-400"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- Circular Floating Recorder -->
    <div class="record-circle" id="circle-btn" title="Open Recorder Menu">
        <i id="circle-icon" class="fas fa-video text-xl text-gray-300"></i>
        <span id="timer-text">00:00</span>
    </div>

    <!-- Hidden Settings Menu -->
    <div class="recorder-menu" id="recorder-menu">
        <h3 class="font-bold text-md mb-2 text-white border-b border-gray-600 pb-1">Recorder Settings</h3>
        <p class="text-xs text-gray-400 mb-3">Format: MP4 (H264)<br>Quality: 1080p</p>
        <button id="record-btn" class="record-btn w-full py-2 rounded font-bold text-white shadow-lg text-sm">
            <i class="fas fa-circle text-[10px] mr-1"></i> START
        </button>
    </div>

    <script>
        // 1. PDF & SLIDE SYSTEM
        let slides = [];
        let currentSlideIndex = 0;
        let slideInks = {}; 

        const uploadInput = document.getElementById('slide-upload');
        const slideImage = document.getElementById('slide-image');
        const uploadPrompt = document.getElementById('upload-prompt');
        const loadingScreen = document.getElementById('loading-screen');

        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadPrompt.style.display = 'none';
            loadingScreen.style.display = 'flex';

            if (file.type === 'application/pdf') {
                // PDF Processing
                const fileReader = new FileReader();
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    slides = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        document.getElementById('loading-text').innerText = `PDF लोड हो रही है... (${i}/${pdf.numPages})`;
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({scale: 2.0}); // High Quality
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({canvasContext: ctx, viewport: viewport}).promise;
                        slides.push(canvas.toDataURL('image/png'));
                    }
                    startPresentation();
                };
                fileReader.readAsArrayBuffer(file);
            } else {
                // Image Processing
                slides = Array.from(e.target.files).sort((a,b)=>a.name.localeCompare(b.name)).map(f => URL.createObjectURL(f));
                startPresentation();
            }
        });

        function startPresentation() {
            loadingScreen.style.display = 'none';
            slideImage.style.display = 'block';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('slide-nav').style.display = 'flex';
            loadSlide(0);
        }

        function loadSlide(index) {
            saveCurrentInk();
            currentSlideIndex = index;
            slideImage.src = slides[currentSlideIndex];
            document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${slides.length}`;
            slideImage.onload = () => { resizeCanvas(); restoreInk(); };
        }

        document.getElementById('prev-btn').addEventListener('click', () => { if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1); });
        document.getElementById('next-btn').addEventListener('click', () => { if (currentSlideIndex < slides.length - 1) loadSlide(currentSlideIndex + 1); });

        // 2. INKING SYSTEM & SIZE SLIDER
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isDrawing = false, lastX = 0, lastY = 0;
        let currentPenSettings = { color: 'glow', type: 'glow' };
        
        const sizeSlider = document.getElementById('pen-size');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        }
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('pointerdown', (e) => { isDrawing = true; [lastX, lastY] = [e.clientX, e.clientY]; });
        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(e.clientX, e.clientY);
            
            let baseSize = parseInt(sizeSlider.value);
            let dynamicSize = baseSize * (0.5 + (e.pressure !== 0 ? e.pressure : 0.5));

            if (currentPenSettings.type === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = baseSize * 5; // Eraser is bigger
                ctx.shadowBlur = 0;
            } else if (currentPenSettings.type === 'glow') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = dynamicSize;
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 15; ctx.shadowColor = '#ff007f';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = dynamicSize;
                ctx.strokeStyle = currentPenSettings.color;
                ctx.shadowBlur = 0;
            }
            ctx.stroke(); [lastX, lastY] = [e.clientX, e.clientY];
        });
        canvas.addEventListener('pointerup', () => isDrawing = false);

        document.querySelectorAll('.ink-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.ink-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                let color = btn.getAttribute('data-color');
                
                if (color === 'glow') { currentPenSettings = { type: 'glow' }; sizeSlider.value = 4; } 
                else if (color === 'erase') { currentPenSettings = { type: 'erase' }; } 
                else if (color === 'rgba(74, 222, 128, 0.4)') { currentPenSettings = { type: 'normal', color: color }; sizeSlider.value = 15; } // Highlighter default thick
                else { currentPenSettings = { type: 'normal', color: color }; sizeSlider.value = 3; }
            });
        });

        document.getElementById('clear-slide').addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));

        function saveCurrentInk() { slideInks[currentSlideIndex] = canvas.toDataURL(); }
        function restoreInk() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (slideInks[currentSlideIndex]) {
                let img = new Image(); img.src = slideInks[currentSlideIndex];
                img.onload = () => ctx.drawImage(img, 0, 0);
            }
        }

        // 3. CIRCULAR RECORDER & MP4 EXPORT
        let mediaRecorder; let recordedChunks = [];
        const circleBtn = document.getElementById('circle-btn');
        const recorderMenu = document.getElementById('recorder-menu');
        const recordBtn = document.getElementById('record-btn');
        const timerText = document.getElementById('timer-text');
        const circleIcon = document.getElementById('circle-icon');
        let timerInterval, startTime;

        // Toggle Menu on Circle Click
        circleBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording(); // Stop if already recording
            } else {
                recorderMenu.style.display = recorderMenu.style.display === 'block' ? 'none' : 'block';
            }
        });

        function updateTimer() {
            const diff = Math.floor((new Date().getTime() - startTime) / 1000);
            const m = String(Math.floor(diff / 60)).padStart(2, '0');
            const s = String(diff % 60).padStart(2, '0');
            timerText.innerText = `${m}:${s}`;
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true
                });
                // Using H264 to make it more compatible as MP4
                const options = { mimeType: 'video/webm; codecs=h264' };
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveVideo;
                
                mediaRecorder.start();
                
                // UI Changes
                recorderMenu.style.display = 'none';
                circleBtn.classList.add('recording');
                circleIcon.style.display = 'none';
                timerText.style.display = 'block';
                startTime = new Date().getTime();
                timerInterval = setInterval(updateTimer, 1000);
            } catch (err) { alert("Recording cancelled."); }
        }

        function stopRecording() {
            if(mediaRecorder) mediaRecorder.stop();
            circleBtn.classList.remove('recording');
            circleIcon.style.display = 'block';
            timerText.style.display = 'none';
            clearInterval(timerInterval);
            timerText.innerText = '00:00';
        }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Class_Video_${new Date().getTime()}.mp4`; // Saved as MP4
            a.click();
            URL.revokeObjectURL(url);
            recordedChunks = [];
        }

        recordBtn.addEventListener('click', startRecording);
    </script>
</body>
</html>
