<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro EduCreator Studio - Advanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0b0b0e; color: white; 
            font-family: 'Segoe UI', sans-serif;
        }
        
        #presentation-area { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center; background: #030305;
        }

        #slide-image { width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        
        #drawing-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; cursor: crosshair; /* Cursor visible रखा गया है */
        }
        
        /* Left Sidebar Dock */
        .side-dock { 
            position: absolute; top: 50%; left: 15px; transform: translateY(-50%); z-index: 100; 
            display: flex; flex-direction: column; gap: 12px; background: rgba(20, 20, 25, 0.85); 
            padding: 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px); align-items: center;
        }
        
        .dock-btn { 
            width: 40px; height: 40px; border-radius: 10px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; 
            background: rgba(255, 255, 255, 0.06); color: white; transition: 0.2s;
        }
        .dock-btn:hover { background: #333; }
        .dock-btn.active { background: #0a84ff; box-shadow: 0 0 8px rgba(10, 132, 255, 0.5); }
        
        /* Recording Settings Menu */
        .rec-settings-menu {
            position: absolute; top: 65px; right: 20px; width: 220px;
            background: #1a1a20; border: 1px solid #333;
            border-radius: 12px; padding: 15px; display: none; z-index: 105; flex-direction: column; gap: 10px;
        }
        .rec-setting-item { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; align-items: center;}
        .rec-setting-item select { background: #2c2c35; color: white; padding: 3px; border-radius: 4px; border: 1px solid #444; }

        /* Recording UI */
        .recorder-ui { position: absolute; top: 15px; right: 20px; z-index: 100; display: flex; gap: 10px; }
        .rec-circle-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; color: white; transition: 0.3s; }
        .rec-circle-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Recording UI -->
    <div class="recorder-ui" id="recorder-ui">
        <span id="timer-text" style="align-self: center; font-family: monospace; color: #ff453a; font-weight: bold;">00:00</span>
        <button class="rec-circle-btn" id="btn-start" style="background: #30d158;"><i class="fas fa-video"></i></button>
        <button class="rec-circle-btn" id="btn-stop" style="background: #ff453a; display: none;"><i class="fas fa-stop"></i></button>
        <button class="rec-circle-btn" id="btn-settings" style="background: #444;"><i class="fas fa-cog"></i></button>
    </div>

    <!-- Recording Settings -->
    <div id="rec-settings-menu" class="rec-settings-menu">
        <div class="text-white font-bold mb-2">Recording Settings</div>
        <div class="rec-setting-item">Res: <select id="set-res"><option value="1280x720">720p</option><option value="1920x1080">1080p</option></select></div>
        <div class="rec-setting-item">FPS: <select id="set-fps"><option value="20">20</option><option value="30">30</option><option value="60">60</option></select></div>
        <div class="rec-setting-item">Mbps: <select id="set-mbps"><option value="1">1</option><option value="2" selected>2</option><option value="5">5</option><option value="8">8</option></select></div>
    </div>

    <div id="presentation-area">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <!-- Left Sidebar Dock -->
    <div class="side-dock" id="toolbar">
        <button class="dock-btn active" id="glow-pen-btn"><i class="fas fa-magic"></i></button>
        <button class="dock-btn" id="normal-pen-btn"><i class="fas fa-pen"></i></button>
        <button class="dock-btn" id="eraser-btn"><i class="fas fa-eraser"></i></button>
        <button class="dock-btn" id="clear-btn" style="color: #ff453a;"><i class="fas fa-trash"></i></button>
    </div>

    <script>
        // Recording Logic
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnSettings = document.getElementById('btn-settings');
        const settingsMenu = document.getElementById('rec-settings-menu');
        
        let mediaRecorder;

        btnSettings.addEventListener('click', () => {
            settingsMenu.style.display = settingsMenu.style.display === 'flex' ? 'none' : 'flex';
        });

        btnStart.addEventListener('click', async () => {
            const [w, h] = document.getElementById('set-res').value.split('x').map(Number);
            const fps = parseInt(document.getElementById('set-fps').value);
            const mbps = parseInt(document.getElementById('set-mbps').value) * 1000000;

            const recCanvas = document.createElement('canvas');
            recCanvas.width = w;
            recCanvas.height = h;
            const recCtx = recCanvas.getContext('2d');

            let recordingInterval = setInterval(() => {
                recCtx.fillStyle = '#000';
                recCtx.fillRect(0, 0, w, h);
                // In production, draw logic goes here
            }, 1000 / fps);

            const stream = recCanvas.captureStream(fps);
            mediaRecorder = new MediaRecorder(stream, { videoBitsPerSecond: mbps });
            
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                clearInterval(recordingInterval);
                const blob = new Blob(chunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Recording_${Date.now()}.webm`;
                a.click();
            };

            mediaRecorder.start();
            btnStart.style.display = 'none';
            btnStop.style.display = 'flex';
            document.getElementById('timer-text').style.display = 'block';
        });

        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            btnStart.style.display = 'flex';
            btnStop.style.display = 'none';
            document.getElementById('timer-text').style.display = 'none';
        });

        // Basic Drawing Setup
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';

        let drawing = false;
        canvas.onmousedown = () => drawing = true;
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); }
        canvas.onmousemove = (e) => {
            if(!drawing) return;
            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();
            ctx.moveTo(e.clientX, e.clientY);
        };
        
        document.getElementById('clear-btn').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
