<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro EduCreator Studio - Ultimate Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #0d0d0d; color: white; user-select: none; touch-action: none; cursor: default; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        #presentation-area { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #050505; }
        #slide-image { max-width: 100%; max-height: 100%; object-fit: contain; position: absolute; z-index: 1; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        #drawing-canvas { 
            position: absolute; 
            z-index: 10; 
            cursor: default; 
        }
        
        /* Upload Prompt Overlay */
        #upload-prompt {
            position: absolute;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #18181b;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            max-width: 500px;
            width: 90%;
        }

        /* iPad & PPT Style Left Side Vertical Toolbar */
        .side-toolbar { 
            position: absolute; top: 50%; left: 20px; transform: translateY(-50%); z-index: 100; 
            display: none; flex-direction: column; gap: 10px; background: rgba(24, 24, 27, 0.9); 
            padding: 12px 10px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(20px);
            align-items: center; transition: all 0.3s ease;
        }
        
        .tool-btn { 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; 
            border: 2px solid transparent; transition: all 0.2s; 
            display: flex; justify-content: center; align-items: center; 
            background: rgba(255, 255, 255, 0.08); color: white; position: relative; font-size: 14px;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
        .tool-btn.active { border-color: #0a84ff; background: #0a84ff; box-shadow: 0 0 12px rgba(10, 132, 255, 0.5); }
        
        .color-picker-wrapper { position: relative; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); }
        #color-picker { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        
        .size-container { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; width: 100%; }
        input[type="range"] { width: 60px; cursor: pointer; accent-color: #0a84ff; height: 4px; border-radius: 2px; background: #555; transform: rotate(-90deg); margin: 15px 0; }

        /* Recorder UI */
        .recorder-ui { 
            position: absolute; top: 20px; right: 20px; z-index: 100; 
            display: none; align-items: center; gap: 10px;
        }
        
        .rec-circle-btn {
            width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.3s; color: white; font-size: 16px;
        }
        #btn-start { background: #30d158; }
        #btn-start:hover { background: #28b84d; transform: scale(1.05); }
        #btn-stop { background: #ff453a; display: none; animation: pulse 1.5s infinite; }
        
        .timer-badge {
            background: rgba(24, 24, 27, 0.9); padding: 6px 12px; border-radius: 20px;
            font-family: monospace; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); display: none; backdrop-filter: blur(10px);
        }

        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255, 69, 58, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); } }

        /* PPT Presentation Slide Navigation Bar (Bottom Center) */
        .slide-nav { 
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 100; 
            display: none; gap: 20px; background: rgba(24, 24, 27, 0.9); padding: 8px 20px; 
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); 
            align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        body.fullscreen-mode .slide-nav { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
        body.fullscreen-mode .slide-nav:hover { opacity: 1; }

        /* Loading Screen */
        #loading-screen { display: none; position: absolute; z-index: 2000; width: 100%; height: 100%; background: rgba(0,0,0,0.92); flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #0a84ff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner mb-4"></div>
        <h2 id="loading-text" class="text-lg font-medium text-white">फाइल हाई-क्वालिटी में प्रोसेस हो रही है...</h2>
    </div>

    <!-- Main Workspace -->
    <div id="presentation-area">
        <!-- Upload Prompt Overlay (Directly Clickable Button Fixed) -->
        <div id="upload-prompt">
            <i class="fas fa-file-powerpoint text-6xl mb-4 text-[#ff453a]"></i>
            <h2 class="text-2xl font-bold mb-2 text-white">क्लास नोट्स या PDF/Images चुनें</h2>
            <p class="text-xs mb-6 text-gray-400">High Quality PDF या Multiple Images अपलोड करें और PPT शो शुरू करें।</p>
            <button type="button" id="browse-btn" class="bg-[#0a84ff] text-white text-sm px-6 py-3 rounded-2xl cursor-pointer hover:bg-blue-600 transition font-semibold shadow-lg">
                <i class="fas fa-folder-open mr-2"></i> फाइल चुनें (Browse Files)
            </button>
            <input type="file" id="slide-upload" accept=".pdf, .ppt, .pptx, image/*" multiple style="display: none;">
        </div>

        <img id="slide-image" src="" style="display: none;">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <!-- Screen Recorder UI -->
    <div class="recorder-ui" id="recorder-ui">
        <span class="timer-badge" id="timer-text">00:00</span>
        <button class="rec-circle-btn" id="btn-start" title="Start Recording"><i class="fas fa-video"></i></button>
        <button class="rec-circle-btn" id="btn-stop" title="Stop & Save"><i class="fas fa-stop"></i></button>
    </div>

    <!-- Side Markup Toolbar -->
    <div class="side-toolbar" id="toolbar">
        <div class="color-picker-wrapper" title="रंग बदलें (Color)">
            <input type="color" id="color-picker" value="#ffff00">
            <button class="tool-btn" id="color-btn" style="background: #ffff00; color: black; z-index: 1; border: none;">
                <i class="fas fa-palette text-xs"></i>
            </button>
        </div>
        <button class="tool-btn active" id="glow-pen-btn" title="Glow Pen"><i class="fas fa-magic"></i></button>
        <button class="tool-btn" id="normal-pen-btn" title="Normal Pen"><i class="fas fa-pen"></i></button>
        <button class="tool-btn" id="highlighter-btn" title="Highlighter"><i class="fas fa-highlighter"></i></button>
        <button class="tool-btn" id="eraser-btn" title="Eraser"><i class="fas fa-eraser"></i></button>
        <button class="tool-btn" id="clear-btn" title="Clear Slide" style="background: rgba(255,69,58,0.2); color: #ff453a;"><i class="fas fa-trash-alt"></i></button>
        <button class="tool-btn" id="fullscreen-btn" title="Full Screen Mode"><i class="fas fa-expand"></i></button>
        <div class="size-container">
            <input type="range" id="pen-size" min="2" max="50" value="6" title="Pen Size">
        </div>
    </div>

    <!-- PPT Show Slide Navigation Bar -->
    <div class="slide-nav" id="slide-nav">
        <button id="prev-btn" class="text-gray-300 hover:text-white text-sm px-2 py-1"><i class="fas fa-chevron-left mr-1"></i> पिछला</button>
        <span id="slide-counter" class="text-white text-xs font-bold tracking-wider bg-black/40 px-3 py-1 rounded-full border border-white/10">1 / 1</span>
        <button id="next-btn" class="text-gray-300 hover:text-white text-sm px-2 py-1">अगला <i class="fas fa-chevron-right ml-1"></i></button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let slides = []; 
        let currentSlideIndex = 0; 
        let slideInks = {}; 
        
        const browseBtn = document.getElementById('browse-btn');
        const uploadInput = document.getElementById('slide-upload');
        const slideImage = document.getElementById('slide-image');
        const uploadPrompt = document.getElementById('upload-prompt');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');

        // Direct Click Trigger for File Dialog
        browseBtn.addEventListener('click', () => {
            uploadInput.click();
        });

        uploadInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            uploadPrompt.style.display = 'none';
            loadingScreen.style.display = 'flex';
            
            try {
                const firstFile = files[0];
                const fileName = firstFile.name.toLowerCase();

                if (firstFile.type === 'application/pdf' || fileName.endsWith('.pdf')) {
                    loadingText.innerText = "PDF को High Quality Slides में बदला जा रहा है...";
                    const fileReader = new FileReader();
                    fileReader.onload = async function() {
                        try {
                            const typedarray = new Uint8Array(this.result);
                            const loadingTask = pdfjsLib.getDocument({ data: typedarray });
                            const pdf = await loadingTask.promise;
                            slides = [];
                            
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const viewport = page.getViewport({ scale: 2.5 }); // High Quality Scale
                                const canvasTemp = document.createElement('canvas');
                                canvasTemp.height = viewport.height; 
                                canvasTemp.width = viewport.width;
                                const contextTemp = canvasTemp.getContext('2d');
                                await page.render({ canvasContext: contextTemp, viewport: viewport }).promise;
                                slides.push(canvasTemp.toDataURL('image/png', 1.0));
                            }
                            startApp();
                        } catch (err) {
                            alert("PDF पढ़ने में त्रुटि: " + err.message);
                            resetUploadUI();
                        }
                    };
                    fileReader.readAsArrayBuffer(firstFile);
                } else if (fileName.endsWith('.ppt') || fileName.endsWith('.pptx')) {
                    alert("कृपया .ppt फाइल को पहले PDF या Images (JPG/PNG) में सेव करके अपलोड करें ताकि बेहतरीन हाई-क्वालिटी मिल सके!");
                    resetUploadUI();
                } else {
                    loadingText.innerText = "इमेज फाइलें लोड हो रही हैं...";
                    slides = files.sort((a,b) => a.name.localeCompare(b.name)).map(f => URL.createObjectURL(f));
                    startApp();
                }
            } catch (err) {
                alert("फाइल इम्पोर्ट करने में समस्या आई। कृपया दूसरी फाइल ट्राई करें।");
                resetUploadUI();
            }
        });

        function resetUploadUI() {
            loadingScreen.style.display = 'none';
            uploadPrompt.style.display = 'flex';
        }

        function startApp() {
            loadingScreen.style.display = 'none'; 
            slideImage.style.display = 'block';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('slide-nav').style.display = 'flex';
            document.getElementById('recorder-ui').style.display = 'flex';
            loadSlide(0);
        }

        function loadSlide(index) {
            saveCurrentInk(); 
            currentSlideIndex = index; 
            slideImage.src = slides[currentSlideIndex]; 
            document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${slides.length}`; 
            slideImage.onload = () => { 
                resizeCanvas(); 
                restoreInk(); 
            }; 
        }

        document.getElementById('prev-btn').addEventListener('click', () => { if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1); });
        document.getElementById('next-btn').addEventListener('click', () => { if (currentSlideIndex < slides.length - 1) loadSlide(currentSlideIndex + 1); });

        // Keyboard Arrow Support for PPT Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                if (currentSlideIndex < slides.length - 1) loadSlide(currentSlideIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1);
            }
        });

        // Full Screen Toggle Feature
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Full-screen error: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                document.body.classList.add('fullscreen-mode');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                document.body.classList.remove('fullscreen-mode');
            }
        });

        // Canvas Drawing Logic
        const canvas = document.getElementById('drawing-canvas'); 
        const ctx = canvas.getContext('2d');
        let isDrawing = false; 
        let points = []; 
        let currentMode = 'glow'; 
        let currentColor = '#ffff00';
        
        const sizeSlider = document.getElementById('pen-size'); 
        const colorPicker = document.getElementById('color-picker'); 
        const colorBtn = document.getElementById('color-btn');
        
        const tools = { 
            'glow': document.getElementById('glow-pen-btn'), 
            'normal': document.getElementById('normal-pen-btn'), 
            'highlighter': document.getElementById('highlighter-btn'), 
            'eraser': document.getElementById('eraser-btn') 
        };

        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round'; 
        }
        window.addEventListener('resize', resizeCanvas);

        function setActiveTool(mode) {
            currentMode = mode; 
            Object.values(tools).forEach(btn => btn.classList.remove('active')); 
            tools[mode].classList.add('active');
            if(mode === 'highlighter') sizeSlider.value = 30; 
            else if(mode === 'eraser') sizeSlider.value = 40; 
            else sizeSlider.value = 6;
        }

        setActiveTool('glow');

        colorPicker.addEventListener('input', (e) => { 
            currentColor = e.target.value; 
            colorBtn.style.background = currentColor; 
        });

        tools['glow'].addEventListener('click', () => setActiveTool('glow')); 
        tools['normal'].addEventListener('click', () => setActiveTool('normal')); 
        tools['highlighter'].addEventListener('click', () => setActiveTool('highlighter')); 
        tools['eraser'].addEventListener('click', () => setActiveTool('eraser'));
        
        document.getElementById('clear-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveCurrentInk();
        });

        canvas.addEventListener('pointerdown', (e) => { 
            isDrawing = true; 
            points = [{x: e.clientX, y: e.clientY}]; 
            ctx.beginPath(); 
            ctx.moveTo(e.clientX, e.clientY); 
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            points.push({x: e.clientX, y: e.clientY});
            let baseSize = parseInt(sizeSlider.value);
            
            if (currentMode === 'eraser') { 
                ctx.globalCompositeOperation = 'destination-out'; 
                ctx.lineWidth = baseSize; 
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = 'rgba(0,0,0,1)'; 
            } else if (currentMode === 'highlighter') { 
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.lineWidth = baseSize; 
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = currentColor + '55'; 
            } else if (currentMode === 'glow') { 
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.lineWidth = baseSize; 
                ctx.shadowBlur = 18; 
                ctx.shadowColor = currentColor; 
                ctx.strokeStyle = currentColor; 
            } else { 
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.lineWidth = baseSize; 
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = currentColor; 
            }

            if (points.length >= 3) {
                const controlPoint = points[points.length - 2];
                const endPoint = { 
                    x: (points[points.length - 2].x + points[points.length - 1].x) / 2, 
                    y: (points[points.length - 2].y + points[points.length - 1].y) / 2 
                };
                ctx.quadraticCurveTo(controlPoint.x, controlPoint.y, endPoint.x, endPoint.y); 
                ctx.stroke(); 
                ctx.beginPath(); 
                ctx.moveTo(endPoint.x, endPoint.y);
            }
        });

        canvas.addEventListener('pointerup', () => { 
            isDrawing = false; 
            points = []; 
            saveCurrentInk();
        });

        function saveCurrentInk() { 
            if(slides.length > 0) {
                slideInks[currentSlideIndex] = canvas.toDataURL(); 
            }
        }

        function restoreInk() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            if (slideInks[currentSlideIndex]) { 
                let img = new Image(); 
                img.src = slideInks[currentSlideIndex]; 
                img.onload = () => ctx.drawImage(img, 0, 0); 
            } 
        }

        // Screen Recording Logic
        let mediaRecorder; 
        let recordedChunks = []; 
        let timerInterval; 
        let seconds = 0;
        
        const btnStart = document.getElementById('btn-start'); 
        const btnStop = document.getElementById('btn-stop'); 
        const timerText = document.getElementById('timer-text');

        btnStart.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveVideo;
                
                mediaRecorder.start(250); 
                btnStart.style.display = 'none'; 
                btnStop.style.display = 'flex'; 
                timerText.style.display = 'block';
                
                seconds = 0;
                timerInterval = setInterval(() => { 
                    seconds++; 
                    timerText.innerText = new Date(seconds * 1000).toISOString().substr(14, 5); 
                }, 1000);
            } catch (err) { 
                alert("स्क्रीन रिकॉर्डिंग की अनुमति नहीं मिली या रद्द कर दी गई।"); 
            }
        });

        btnStop.addEventListener('click', () => { 
            if(mediaRecorder) mediaRecorder.stop(); 
            btnStart.style.display = 'flex'; 
            btnStop.style.display = 'none'; 
            timerText.style.display = 'none'; 
            clearInterval(timerInterval); 
        });

        async function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob); 
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `Class_Recording_${new Date().getTime()}.webm`; 
            a.click();
        }
    </script>
</body>
</html>
